<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!--
    FilmoNation — sello (solo marca, sin wordmark)
    Se adapta automáticamente al tema del sistema/página vía prefers-color-scheme.
    Funciona embebido como <img>, <object> o SVG inline. En <img>, el soporte de
    prefers-color-scheme depende del navegador; para garantizarlo siempre, insértalo
    inline (<svg> directo en el HTML) u con <object data="...">.
  -->
  <style>
    :root {
      --seal-color: #C9A227; /* dorado — lectura por defecto, pensada sobre fondo oscuro */
    }
    @media (prefers-color-scheme: light) {
      :root {
        --seal-color: #7A5A12; /* dorado oscurecido — mantiene contraste sobre fondo claro */
      }
    }
    .ring-outer { fill: none; stroke: var(--seal-color); stroke-width: 12; }
    .ring-inner { fill: none; stroke: var(--seal-color); stroke-width: 5; stroke-dasharray: 8 10; opacity: 0.85; }
    .seal-text  { fill: var(--seal-color); font-family: Fraunces, Georgia, serif; font-weight: 900; }
  </style>

  <g transform="translate(100,100)">
    <circle class="ring-outer" cx="0" cy="0" r="92"/>
    <circle class="ring-inner" cx="0" cy="0" r="74"/>
    <text class="seal-text" x="0" y="32" text-anchor="middle" font-size="95">FN</text>
  </g>
</svg>